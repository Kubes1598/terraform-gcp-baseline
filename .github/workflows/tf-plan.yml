name: Terraform plan
on:
  pull_request:
    branches: [main]
    paths: ["**.tf", ".github/workflows/tf-plan.yml"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - run: terraform fmt -check -recursive
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with: { soft_fail: false }

      - name: checkov
        uses: bridgecrewio/checkov-action@v12

      - name: terraform plan
        run: terraform plan -no-color -out=plan.bin

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = require('child_process').execSync('terraform show -no-color plan.bin').toString();
            github.rest.issues.createComment({
              issue_number: context.issue.number, owner: context.repo.owner,
              repo: context.repo.repo,
              body: '```terraform\n' + plan.slice(0, 60000) + '\n```',
            });
